# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX (property key is case-sensitive: capital X)
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 enables both a built-in Kotlin baseline (KGP 2.2.10) AND a "new DSL" by default.
# We instead apply the standalone Kotlin Gradle plugin 2.4.0 via the version catalog, so the
# Compose and serialization compiler plugins line up exactly with our Kotlin version. That
# requires opting out of both AGP-9 defaults:
#   - builtInKotlin=false : don't let AGP also apply its own (older) Kotlin plugin
#   - newDsl=false        : the standalone KGP isn't compatible with AGP 9's new DSL yet
# (newDsl is slated for removal in AGP 10, where migrating to built-in Kotlin is required.)
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
