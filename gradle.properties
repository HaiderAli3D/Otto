# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX
android.useAndroidx=true
android.nonTransitiveRClass=true

# AGP 9 ships a *built-in* Kotlin baseline (KGP 2.2.10). We disable it and apply the
# standalone Kotlin Gradle plugin (2.4.0) via the version catalog instead, so the
# Compose and serialization compiler plugins line up exactly with our Kotlin version.
android.builtInKotlin=false

kotlin.code.style=official
